<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrackr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>JobTrackr</h1>
        <p>Track your job application in one place.</p>
    </header>

    <main>
        <h2>Dashboard</h2>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Applications</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Interviews</h3>
                <p>0</p>
            </div>

            <div class="stat-card">
                <h3>Selected</h3>
                <p>0</p>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
