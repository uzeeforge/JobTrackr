<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTrackr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>JobTrackr</h1>
        <p>Track your job applications with confidance.</p>

   </header>

    <main>
        <h2>Dashboard</h2>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Applications</h3>
                <p id="totalApplications">0</p>
            </div>

            <div class="stat-card">
                <h3>Interviews</h3>
                <p id="interviews">0</p>
            </div>

            <div class="stat-card">
                <h3>Selected</h3>
                <p id="selected">0</p>
            </div>
        </section>
        <section class="application-form">
            <h2>Add Job Application</h2>

            <form>
                <label for="company">Company Name</label>
                <input type="text" id="company" required>

                <label for="role">Job Role</label>
                <input type="text" id="role" required>

                <label for="date">Date Applied</label>
                <input type="date" id="date" required>

                <label for="status">Application Status</label>
                <select id="status">
                    <option value="Applied">Applied</option>
                    <option value="Interview">Interview</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Selected">Selected</option>
                </select>

                <label for="notes">Notes</label>
                <textarea id="notes"></textarea>
<label for="link">Job Posting Link</label>
<input type="url" id="link">
                <button type="submit">Add Application</button>
            </form>
        </section>

                <section class="application-list"
                id="applicationList">
            <h2>Your Applications</h2>
            <input type="text" id="searchInput" placeholder="Search applications...">
            </section>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
